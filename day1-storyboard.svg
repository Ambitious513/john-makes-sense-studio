<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="phoneGlow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0%" stop-color="#a9d0ff" stop-opacity="0.60"/>
      <stop offset="42%" stop-color="#7fb2ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7fb2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.78">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="68%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="redGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- charcoal void -->
  <rect width="1600" height="900" fill="#0d0d0d"/>

  <!-- ground line -->
  <path d="M70 732 C 520 729 1080 735 1530 731" stroke="#3a3a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- couch shadow -->
  <ellipse cx="800" cy="738" rx="430" ry="14" fill="#000000" opacity="0.45"/>

  <!-- couch -->
  <g>
    <rect x="452" y="700" width="20" height="36" rx="6" fill="#1b1b1b"/>
    <rect x="1128" y="700" width="20" height="36" rx="6" fill="#1b1b1b"/>
    <rect x="430" y="398" width="740" height="222" rx="30" fill="#1e1e1e"/>
    <rect x="430" y="556" width="740" height="150" rx="26" fill="#252525"/>
    <rect x="398" y="466" width="112" height="246" rx="28" fill="#2a2a2a"/>
    <rect x="1090" y="466" width="112" height="246" rx="28" fill="#2a2a2a"/>
    <line x1="650" y1="568" x2="650" y2="692" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="950" y1="568" x2="950" y2="692" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- character: lying on back across the couch -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- legs -->
    <rect x="872" y="528" width="212" height="42" rx="21" fill="#464646" stroke="#141414" stroke-width="3"/>
    <rect x="872" y="482" width="218" height="42" rx="21" fill="#505050" stroke="#141414" stroke-width="3"/>
    <!-- shoes resting on right armrest -->
    <rect x="1058" y="478" width="58" height="50" rx="16" fill="#232323" stroke="#141414" stroke-width="3"/>
    <rect x="1058" y="524" width="58" height="50" rx="16" fill="#232323" stroke="#141414" stroke-width="3"/>

    <!-- torso: dark grey t-shirt -->
    <rect x="558" y="470" width="332" height="102" rx="34" fill="#4d4d4d" stroke="#141414" stroke-width="3"/>
    <path d="M600 486 Q 720 474 850 488" stroke="#5c5c5c" stroke-width="4" fill="none" opacity="0.8"/>

    <!-- head: cream bean -->
    <ellipse cx="512" cy="498" rx="62" ry="56" fill="#f2e9d5" stroke="#1c1c1c" stroke-width="3"/>

    <!-- arms reaching up to the phone -->
    <path d="M596 500 L 556 428" stroke="#4d4d4d" stroke-width="26" fill="none"/>
    <path d="M556 428 L 534 374" stroke="#f2e9d5" stroke-width="20" fill="none" stroke-opacity="0.95"/>
    <path d="M614 510 L 574 438" stroke="#4d4d4d" stroke-width="26" fill="none"/>
    <path d="M574 438 L 550 380" stroke="#f2e9d5" stroke-width="20" fill="none" stroke-opacity="0.95"/>

    <!-- simple hand-drawn face, gazing up -->
    <circle cx="492" cy="490" r="5" fill="#2b2b2b"/>
    <circle cx="532" cy="490" r="5" fill="#2b2b2b"/>
    <path d="M500 522 Q 512 530 524 522" stroke="#2b2b2b" stroke-width="3.5" fill="none"/>
  </g>

  <!-- cool blue light from the screen -->
  <ellipse cx="512" cy="432" rx="198" ry="178" fill="url(#phoneGlow)"/>
  <!-- faint blue tint on the face -->
  <ellipse cx="512" cy="502" rx="72" ry="62" fill="#9cc4ff" opacity="0.16"/>

  <!-- smartphone held above the face -->
  <g transform="rotate(-8 512 348)">
    <rect x="462" y="280" width="100" height="140" rx="16" fill="#151515" stroke="#000000" stroke-width="2"/>
    <rect x="472" y="292" width="80" height="116" rx="8" fill="#cfe6ff"/>
    <circle cx="512" cy="350" r="2.5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- hands gripping the phone -->
  <circle cx="472" cy="360" r="15" fill="#f2e9d5" stroke="#1c1c1c" stroke-width="2.5"/>
  <circle cx="552" cy="356" r="15" fill="#f2e9d5" stroke="#1c1c1c" stroke-width="2.5"/>

  <!-- red digital clock -->
  <text x="70" y="112" font-family="'Consolas','Courier New',monospace" font-size="58" font-weight="bold"
        letter-spacing="2" fill="#ff4b3d" filter="url(#redGlow)">0h 06m</text>

  <!-- hand-drawn title -->
  <text x="800" y="138" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE',cursive"
        font-size="118" font-weight="bold" letter-spacing="10" fill="#f2e9d5"
        transform="rotate(-1.2 800 138)">DAY 1</text>

  <!-- moody vignette -->
  <rect width="1600" height="900" fill="url(#vignette)" pointer-events="none"/>
</svg>
